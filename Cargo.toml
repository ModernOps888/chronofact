[package]
name = "chronofact"
version = "0.1.0"
edition = "2021"
description = "Epistemic AI Backbone: Combating Knowledge Cutoff, Hallucination, and Cross-Session Amnesia"
authors = ["ChronoFact Team"]

[lib]
name = "chronofact"
path = "src/lib.rs"

[[bin]]
name = "chronofact"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
url = "2.5"
ipnetwork = "0.20"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
sha2 = "0.10"
scraper = "0.21"
async-trait = "0.1"
thiserror = "2.0"
urlencoding = "2.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.14"
